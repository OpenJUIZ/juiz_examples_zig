name: example_container
option:
  http_broker:
    start: true
    port: 8000
plugins:
  container_factories:
    example_container_zig:
      language: "zig"
      path: "./build/plugins"
      processes:
        example_container_zig_increment:
          path: "./build/plugins"
        example_container_zig_get:
          path: "./build/plugins"
containers:
  - type_name: example_container_zig
    name: container0
    value: 10
    processes:
      - type_name: example_container_zig_increment
        name: increment0
      - type_name: example_container_zig_get
        name: get0
